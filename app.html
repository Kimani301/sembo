function clrNmGo(c){if(!CL.includes(c)||!canEdit(c))return;if((($("#dc")||{}).value||"").trim().toUpperCase()!=="CLEAR")return T("Type CLEAR to confirm");
  const ids=new Set(S.st.filter(s=>!s.left&&s.cls===c).map(s=>s.id));if(!ids.size){cm();return T("There are no students in "+c)}
  const part=i=>k=>ids.has(k.split("|")[i]);
  S.fp=(S.fp||[]).filter(v=>!ids.has(v.sid));
  Object.keys(S.res||{}).forEach(k=>{if(part(3)(k))delete S.res[k]});
  Object.keys(S.rem||{}).forEach(k=>{if(part(3)(k))delete S.rem[k]});
  Object.keys(S.attendance||{}).forEach(k=>{if(part(1)(k))delete S.attendance[k]});
  Object.keys(S.bcs||{}).forEach(k=>{if(part(3)(k))delete S.bcs[k]});
  Object.keys(S.sms||{}).forEach(k=>{if(ids.has(k.split("|").pop()))delete S.sms[k]});
  S.receipts=(S.receipts||[]).filter(r=>!S.st.some(s=>ids.has(s.id)&&s.name===r.student&&s.adm===r.adm));
  if(S.lead){Object.keys(S.lead).forEach(k=>{if(k!=="pref"&&ids.has(S.lead[k]))S.lead[k]=""});if(S.lead.pref)Object.keys(S.lead.pref).forEach(k=>{S.lead.pref[k]=(S.lead.pref[k]||[]).filter(x=>!ids.has(x))})}
  S.st=S.st.filter(s=>!ids.has(s.id));
  LOG("Cleared all "+ids.size+" student name"+(ids.size===1?"":"s")+" in "+c);save();cm();R();T(c+" is now empty")}

const CLS_CELL=/^(?:grade|class|std|form)?\s*([789])\s*[-\s]?\s*(athi|tana)$/i,CLS_ANY=/\b([789])\s*[-\s]?\s*(athi|tana)\b/i;

    else if(cols.length===1){const m=l.match(CLS_ANY);if(m){cls=m[1]+" "+capw(m[2]);cols=[l.replace(CLS_ANY,"").replace(/[\s\-–:]+$/,"").trim()]}}
    if(cols.length&&/^\d+[.)]?$/.test(cols[0])&&cols.length>1)cols.shift();
    const ai=cols.findIndex(v=>/^OS[A-Z0-9\/-]+$/i.test(v));if(ai>-1){adm=admN(cols[ai]);cols.splice(ai,1)}
    const pi=cols.findIndex(v=>/^\+?\d[\d\s]{8,}$/.test(v));if(pi>-1){let p=cols[pi].replace(/\s/g,"");if(p.startsWith("+254"))p="0"+p.slice(4);else if(p.startsWith("254"))p="0"+p.slice(3);if(/^0[17]\d{8}$/.test(p))phone=p;cols.splice(pi,1)}
