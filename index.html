<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="First aid guides, emergency contacts and SOS alerts.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>FirstAid</title>
<style>
:root{--navy:#8f0d1c;--navy2:#e11d2e;--green:#e11d2e;--red:#e11d2e;--ink:#2a0d12;--bg:#fff4f4;--card:#fff;--mut:#8a5a60;--line:#f6dcdc;--sh:0 6px 22px rgba(143,13,28,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;align-items:center;gap:8px;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(143,13,28,.3);z-index:2}
header h1{font-size:20px;font-weight:700;flex:1;letter-spacing:.2px}
header button{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}
header button[hidden]{display:none}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}
nav{display:flex;align-items:flex-end;background:var(--card);margin:6px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px;box-shadow:var(--sh);padding:6px 4px}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:11.5px;color:var(--mut);border-radius:16px}
nav button b{display:block;font-size:20px;font-weight:400;line-height:1.3}
nav button.on{color:var(--navy2);font-weight:700}
nav button.sosn b{width:54px;height:54px;margin:-26px auto 2px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px rgba(225,29,46,.5);border:4px solid var(--card)}
nav button.sosn{color:var(--red);font-weight:700}
.ban{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:22px;padding:14px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#8f0d1c,#e11d2e);box-shadow:var(--sh)}
.ban b{font-size:18px;line-height:1.25;max-width:55%}
.ban svg{flex:none;width:128px;height:96px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cross{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#fff;color:var(--red);font-size:40px;font-weight:900;line-height:1;box-shadow:var(--sh)}
.hero h2{font-size:26px;line-height:1.1}.hero p{color:var(--mut);font-size:14px}
.alert{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#7f0f1e,#3b0610);box-shadow:0 10px 24px rgba(59,6,16,.35);font-size:17px;font-weight:700}
.alert small{display:block;font-weight:400;opacity:.92;font-size:13px}
.alert i{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:14px;box-shadow:var(--sh);color:var(--ink);font-size:15.5px;font-weight:650;line-height:1.25}
.gt.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.gt small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.gt i,.tile i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--c,#2563c9)}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);color:var(--ink);font-size:16px;font-weight:650;margin-bottom:10px}
.tile small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.tile::after{content:'›';margin-left:auto;color:var(--mut);font-size:26px}
.gt:active,.tile:active,.alert:active{transform:scale(.98)}
.sosbtn{display:block;margin:20px auto 8px;width:160px;height:160px;border-radius:50%;border:10px solid rgba(225,29,46,.18);background:radial-gradient(circle at 35% 30%,#ff5566,var(--red) 60%,#a30d1c);color:#fff;font-size:40px;font-weight:800;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,46,.45)}70%,100%{box-shadow:0 0 0 26px rgba(225,29,46,0)}}
@media(prefers-reduced-motion:reduce){.sosbtn{animation:none}}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font-size:17px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}.row>div{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:650;background:var(--green);color:#fff}
.btn.red{background:var(--red)}.btn.ghost{background:var(--line);color:var(--ink)}
.btn.block{display:block;width:100%}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:8px}
input:focus{outline:2px solid var(--navy2);border-color:transparent}
.gh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.gh i{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-style:normal;font-size:32px;background:var(--card);box-shadow:var(--sh)}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.warn{background:#fff4d6;color:#6a4b00;border-radius:14px;padding:12px;font-size:14px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
.dang{background:#fff1f2;border:2px solid #e11d2e;color:#8f0d1c;border-radius:16px;padding:12px;margin-bottom:12px}
.prev{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#111;display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:650;text-align:center;cursor:pointer;color:var(--ink)}
.mb b{font-size:26px;font-weight:400}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 8px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--sh);font-size:15px;font-weight:700;color:var(--ink);text-align:center}
.cat i{font-style:normal;font-size:32px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.opt.ok{border-color:var(--green);background:#dff5e8;color:#0d4a27}.opt.bad{border-color:var(--red);background:#fde3e3;color:#7a1414}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
#ov{position:fixed;inset:0;background:linear-gradient(160deg,#f0364a,#a30d1c);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#ov.show{display:flex}
#ov.res{justify-content:flex-start;overflow-y:auto;padding:24px 16px}
#ov .sc{background:rgba(255,255,255,.15);border-radius:18px;padding:12px;margin:12px 0;width:100%;max-width:440px;text-align:left}
#ov .sc h3{margin:0 0 6px;font-size:16px}
#ov .sc small{display:block;opacity:.85}
#ov .sc .btn{width:100%}
#ov .sc .row .btn{width:auto}
#ov .big{font-size:96px;font-weight:800;line-height:1}
#ov .btn{background:#fff;color:var(--red);margin-top:10px;min-width:200px}
a{color:inherit}
@media(min-width:800px){
body{max-width:none}
header{padding-left:max(24px,calc((100% - 1000px)/2));padding-right:max(24px,calc((100% - 1000px)/2))}
main{padding:24px max(24px,calc((100% - 1000px)/2)) 12px}
.grid{grid-template-columns:repeat(3,1fr)}
.gt.wide{grid-column:auto;flex-direction:column;align-items:flex-start}
.ban svg{width:170px;height:128px}.ban b{font-size:22px}
nav{width:640px;max-width:100%;margin:6px auto 14px}
#ov{padding:48px}
}
#hospitalMap{height:440px;width:100%;border-radius:16px;z-index:1;background:#e5e7eb;border:1px solid #d7dce2;overflow:hidden}
.hospital-map-wrap{position:relative;margin-top:12px}
.hospital-map-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hospital-map-head b{font-size:14px}
.hospital-map-head span{font-size:12px;color:var(--mut)}
.leaflet-popup-content{font-size:14px;line-height:1.5}
.map-go{display:inline-block;margin-top:7px;padding:7px 13px;border-radius:9px;background:#b91c1c;color:#fff;text-decoration:none;font-weight:700}
.user-map-dot{width:20px;height:20px;border:4px solid #fff;border-radius:50%;background:#2563eb;box-shadow:0 0 0 7px rgba(37,99,235,.22)}
.hospital-map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.hospital-map-legend span{display:flex;align-items:center;gap:5px}
.hospital-map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
@media(min-width:800px){#hospitalMap{height:560px}}
/* Full-screen hospital view */
#hospitalView{display:none;position:fixed;inset:0;z-index:1000;background:#fff;overflow-y:auto;color:#241216;padding-bottom:env(safe-area-inset-bottom,0px)}
#hospitalView.open{display:block}
.hv-top{position:sticky;top:0;z-index:1002;background:#8f0d1c;color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 3px 12px #0003}
.hv-top button{border:0;background:#ffffff22;color:white;border-radius:12px;padding:9px 13px;font-size:15px;font-weight:700}
.hv-top strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hospitalFullMap{height:62vh;min-height:360px;width:100%;background:#d9e0e5}
.hv-content{padding:16px;max-width:900px;margin:auto}
.hv-meta{color:#70545a;font-size:14px;margin:4px 0 14px}
.hv-tabs{display:flex;gap:8px;position:sticky;top:58px;background:#fff;padding:8px 0;z-index:5}
.hv-tabs button{flex:1;border:1px solid #f0cdd1;background:#fff5f5;color:#8f0d1c;border-radius:12px;padding:12px 8px;font-weight:750}
.hv-tabs button.active{background:#8f0d1c;color:#fff;border-color:#8f0d1c}
.hv-photo{width:100%;height:230px;object-fit:cover;border-radius:16px;background:#f4e7e8;display:block}
.hv-photo-placeholder{min-height:190px;border-radius:16px;background:linear-gradient(135deg,#fbe8ea,#f5d4d8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#8f0d1c;text-align:center;padding:20px}
.hv-photo-placeholder .ico{font-size:48px}
.hv-photo-link{display:inline-block;margin-top:12px;background:#8f0d1c;color:#fff;text-decoration:none;padding:12px 16px;border-radius:12px;font-weight:700}
.hv-service{padding:12px 0;border-bottom:1px solid #f2dfe1;display:flex;gap:10px;align-items:flex-start}
.hv-service:last-child{border-bottom:0}
.hv-service i{font-style:normal;font-size:20px}
.hv-note{background:#fff5dc;color:#684900;border-radius:12px;padding:12px;font-size:13px;margin-top:12px}
.leaflet-tile{image-rendering:auto}
.leaflet-control-attribution{font-size:10px!important}
@media(min-width:800px){#hospitalFullMap{height:68vh;min-height:480px}.hv-content{padding:22px}}

.hospital-photo{width:100%;height:150px;object-fit:cover;border-radius:15px;display:block;margin-bottom:12px}
.hospital-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hospital-item:last-child{border-bottom:0}.hospital-pin{width:46px;height:46px;border-radius:14px;background:#ffe3e6;display:grid;place-items:center;font-size:25px;flex:none}
.map-note{font-size:12px;color:var(--mut);margin-top:7px}
.ask-home{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border:0;border-radius:20px;margin:12px 0 14px;text-align:left;color:#fff;background:linear-gradient(120deg,#9f1239,#e11d2e 65%,#f97316);box-shadow:0 8px 22px rgba(190,18,60,.22)}
.ask-home .ask-icon{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:29px;flex:none}
.ask-home b{display:block;font-size:18px}.ask-home small{display:block;opacity:.92;font-size:13px}
.home-welcome{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 18px}
.home-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--red)}
.home-welcome h2{font-size:29px;line-height:1.08;margin:5px 0 7px;color:var(--ink)}
.home-welcome p{font-size:13px;color:var(--mut)}
.home-cross{width:76px;height:76px;display:grid;place-items:center;flex:none;border-radius:25px;background:linear-gradient(145deg,#fff,#ffe0e4);color:var(--red);font-size:48px;font-weight:900;box-shadow:var(--sh)}
.home-ask,.home-emergency{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:14px;text-align:left;margin:0 0 11px;color:#fff}
.home-ask{background:linear-gradient(115deg,#8f0d1c,#e11d2e 75%,#f97316);box-shadow:0 8px 22px rgba(190,18,60,.2)}
.home-ask-icon,.home-emergency-icon{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:15px;background:rgba(255,255,255,.18);font-size:26px}
.home-ask-copy{flex:1}.home-ask b,.home-emergency b{display:block;font-size:16px}.home-ask small,.home-emergency small{display:block;font-size:12px;line-height:1.35;opacity:.9;margin-top:2px}
.home-emergency{background:#fff;border:1px solid #f3c7cc;color:#8f0d1c;box-shadow:var(--sh)}
.home-emergency-icon{background:#fff0f1;color:#c5162b}
.home-arrow{font-size:27px;line-height:1;opacity:.8}
.home-section-head{display:flex;align-items:end;justify-content:space-between;margin:19px 2px 10px}
.home-section-head h3{font-size:18px}.home-section-head p{font-size:12px;color:var(--mut)}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-feature{position:relative;min-height:128px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:13px 12px;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--ink);text-align:left;box-shadow:var(--sh)}
.home-feature-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--feature) 12%,white);font-size:22px}
.home-feature-title{font-size:14px;font-weight:750;line-height:1.2}.home-feature small{font-size:11px;color:var(--mut);padding-right:12px}
.home-feature-arrow{position:absolute;right:11px;bottom:10px;font-size:21px;color:var(--mut)}
.home-feature:active,.home-ask:active,.home-emergency:active{transform:scale(.98)}
.home-reminder{display:flex;align-items:flex-start;gap:10px;padding:13px;margin:14px 0 5px;border-radius:16px;background:#fff7e6;border:1px solid #f6e2b4;color:#694b0b}
.home-reminder>span{font-size:22px}.home-reminder b{display:block;font-size:13px}.home-reminder small{display:block;font-size:12px;line-height:1.4;margin-top:2px}
@media(min-width:800px){.home-welcome{padding:12px 4px 22px}.home-welcome h2{font-size:36px}.home-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.home-feature{min-height:140px}}

.leaflet-popup-content{font-size:13px}.leaflet-container{font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
/* red and white blend */
:root{color-scheme:light;--bg:#ffffff;--ink:#3b0a12;--line:#f1d3d7}
.card,.gt,.tile,.opt,nav{border:1px solid var(--line)}
:root{--bg:#fdf4f5;--line:#f3dcdf;--mut:#7d6469;--ink:#2b1a1d;--sh:0 4px 18px rgba(143,13,28,.08);--head:#c81428}
header{background:var(--card);color:var(--head);box-shadow:0 4px 18px rgba(143,13,28,.1);border-bottom:3px solid #e11d2e}
header h1{color:var(--head)}
header button{background:#ffe3e6;color:#c81428}
.ban{background:linear-gradient(135deg,#fff,#ffe6e9);color:var(--head);border:1px solid var(--line)}
.cross{background:#e11d2e;color:#fff}
.hero h2{color:var(--head)}
.alert{background:linear-gradient(135deg,#ef3347,#c8102e);box-shadow:0 10px 24px rgba(225,29,46,.3)}
.gt i,.tile i{background:#ffe3e6}
nav button.on{color:var(--head)}
:root{--bg:#ffffff;--ink:#3b0a12;--line:#f1d3d7}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#ffe3e6;color:#c81428}.pill.Responding{background:#fff1d6;color:#8a5a00}.pill.Resolved{background:#dff5e8;color:#0d4a27}
nav:empty{display:none}
#back{width:auto;border-radius:20px;padding:0 14px;font-size:15px;font-weight:600}
.msg{max-width:92%;padding:10px 14px;border-radius:18px;margin-bottom:10px;font-size:15.5px}
.msg.u{background:#e11d2e;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-bottom-left-radius:4px}
.msg p{margin:0 0 6px}.msg ul,.msg ol{padding-left:20px;margin:0 0 6px}
.askbar{display:flex;gap:8px}.askbar input{margin:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-size:14px;color:var(--ink)}
.chathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.chathead b{font-size:15px;color:var(--mut)}.chathead button{border:0;background:var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:650;color:var(--ink)}
.m2{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}.m2.u{justify-content:flex-end}.m2 .msg{margin:0;max-width:calc(100% - 42px)}.m2.u .msg{max-width:85%}
.who{width:32px;height:32px;border-radius:50%;background:#ffe3e6;display:grid;place-items:center;font-size:17px;flex:none}
.tm{display:block;font-size:11px;opacity:.6;margin-top:4px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:8px 0 6px;margin-top:6px;z-index:2}
.msg.err{border-color:#e11d2e;background:#fff1f2}.errd{font-size:11px;opacity:.7;word-break:break-word;margin-top:4px}
.dots::after{content:'';animation:dt 1.2s infinite}@keyframes dt{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.pic{flex:none;display:grid;place-items:center;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 20%,#fff 0,#ffdfe3 38%,#ff9fab 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 4px 10px rgba(143,13,28,.18)}
.pic::before{content:'';position:absolute;width:62%;height:62%;right:-14%;bottom:-14%;border-radius:50%;background:rgba(225,29,46,.2)}
.pic::after{content:'';position:absolute;width:26%;height:26%;left:10%;top:12%;border-radius:50%;background:rgba(255,255,255,.7)}
.pic span{position:relative;line-height:1;z-index:1}
.pic.hero{width:100%;border-radius:20px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:10px}
/* blended red theme: red stays the lead colour, softened with rose, coral and warm orange */

const DB={
  async saveAlert(a){
    if(useFB){try{await fbDb.collection('Emergencies').add({...a,userId:fbAuth.currentUser?fbAuth.currentUser.uid:null,status:'New',time:firebase.firestore.FieldValue.serverTimestamp()});return}catch(e){}}
    const t=Date.now(),l=store.get('allAlerts',[]);l.unshift({...a,id:'L'+t,time:t,status:'New'});l.forEach((x,i)=>{if(i>=5)delete x.photo});store.set('allAlerts',l.slice(0,100));
  },
  watch(cb){
    if(useFB){return fbDb.collection('Emergencies').orderBy('time','desc').limit(100).onSnapshot(
      s=>cb(s.docs.map(d=>{const x=d.data();return{...x,id:d.id,time:x.time&&x.time.toMillis?x.time.toMillis():Date.now()}}),''),
      e=>cb(null,e.message))}
    const f=()=>cb(store.get('allAlerts',[]),'');f();const id=setInterval(f,4000);return()=>clearInterval(id);
  },
  saveNums(l){if(useFB)fbDb.collection('Settings').doc('numbers').set({list:l.map(x=>({name:x[0],phone:x[1]}))}).catch(()=>{})},
  async setStatus(id,st){
    if(useFB){await fbDb.collection('Emergencies').doc(id).update({status:st});return}
    const l=store.get('allAlerts',[]),x=l.find(a=>a.id===id);if(x)x.status=st;store.set('allAlerts',l);
  }
};

function shrinkImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);let W=800,q=0.7,out='';
    for(let k=0;k<6;k++){const r=Math.min(1,W/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
      if(out.length<180000)break;W=Math.round(W*0.8);q=Math.max(0.45,q-0.08)}
    out.length<700000?res(out):rej(new Error('Photo is too large'))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read this photo'))};im.src=u})}

const AI_SYS="You are Ask First Aid, a caring, knowledgeable first-aid and health-safety assistant inside the FirstAid school app in Kenya. The emergency number is 112. Answer every question about first aid, injuries, illness, hygiene, health and safety fully and helpfully, like an experienced first aider talking to a student or teacher. Use simple words and clear Markdown: short paragraphs, numbered steps for what to do, bullet points, and **bold** for warnings. Say clearly when to call 112 or go to hospital. For medicines, say to follow the label or ask a pharmacist and never give exact doses for children. Politely decline topics unrelated to health and safety. Reply in the language the person writes in (English or Kiswahili).";
const AI_BASE='https://firebasevertexai.googleapis.com/v1beta/projects/'+FB.projectId+'/models/';
async function aiRest(model,contents){
  const r=await fetch(AI_BASE+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':FB.apiKey,'x-goog-api-client':'firebase-js/'+AI_VER+' fire/'+AI_VER},
    body:JSON.stringify({contents,systemInstruction:{parts:[{text:AI_SYS}]},generationConfig:{maxOutputTokens:2048},safetySettings:[{category:'HARM_CATEGORY_DANGEROUS_CONTENT',threshold:'BLOCK_ONLY_HIGH'}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status+' '+((j.error&&((j.error.status||'')+': '+j.error.message))||r.statusText));
  const c=j.candidates&&j.candidates[0],t=c&&c.content&&c.content.parts?c.content.parts.map(x=>x.text||'').join(''):'';
  if(!t)throw new Error('SAFETY blocked '+((j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason)||'empty'));
  return t}
async function aiRun(contents){let last;for(const n of AI_MODELS){try{return await aiRest(n,contents)}catch(e){last=e;if(!/404|NOT_FOUND|not found|no longer available|deprecated|retired|429|RESOURCE_EXHAUSTED|update your code/i.test(String((e&&e.message)||e)))throw e}}throw last}
const askAI=parts=>aiRun([{role:'user',parts:(Array.isArray(parts)?parts:[parts]).map(x=>typeof x==='string'?{text:x}:x)}]);
const chatAI=(hist,q)=>aiRun([...hist,{role:'user',parts:[{text:q}]}]);
function aiErr(e){const m=String((e&&e.message)||e||'');
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return{t:'Could not reach the AI service. Check your internet connection and tap Try again.',d:m};
  if(/PERMISSION_DENIED|403|has not been used|not been enabled|API key not valid|API_KEY/i.test(m)){
    if(/referer|referrer/i.test(m))return{t:'Your API key does not allow this website. In Google Cloud Console > APIs and Services > Credentials, open the browser key and add your GitHub Pages address (like https://yourname.github.io/*) under Website restrictions, or choose None.',d:m};
    if(/App Check|appcheck/i.test(m))return{t:'Firebase App Check is blocking the AI. In the Firebase console open App Check > APIs and set Firebase AI Logic to Unenforced (or set up App Check).',d:m};
    if(/blocked|SERVICE_BLOCKED|restrict/i.test(m))return{t:'Your Firebase API key is blocking the AI. In Google Cloud Console > APIs and Services > Credentials, open the browser key. Under API restrictions choose Dont restrict key, or add Firebase AI Logic API to the list.',d:m};
    return{t:'Ask First Aid is not switched on for this Firebase project yet. In the Firebase console open Build > AI Logic > Get started, choose Gemini Developer API, then wait 2 to 5 minutes and try again.',d:m}}
  if(/429|quota|RESOURCE_EXHAUSTED/i.test(m))return{t:'Ask First Aid is very busy right now (the free limit was reached). Please try again in a minute.',d:m};
  if(/SAFETY|blocked|PROHIBITED/i.test(m))return{t:'I could not answer that one. Please ask it in a different way. If it is urgent, call '+mainNum()+'.',d:m};
  return{t:'Ask First Aid could not answer. Check your internet and tap Try again.',d:m}}
async function aiProbe(){let net=true,svc=true;
  try{await fetch('https://www.google.com/generate_204',{mode:'no-cors',cache:'no-store'})}catch(e){net=false}
  if(net){try{await fetch(AI_BASE+AI_MODELS[0]+':generateContent?key='+encodeURIComponent(FB.apiKey),{method:'POST',body:'{}'})}catch(e){svc=false}}
  return net?(svc?'ok':'svc'):'net'}
async function aiFail(e){const er=aiErr(e);
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(String((e&&e.message)||e||''))){const k=await aiProbe();
    if(k==='net')er.t='This screen is blocked from the internet. It looks like the app is open inside a preview or viewer. Open your published app link (GitHub Pages) in Chrome, or the installed app, then try again.';
    else if(k==='svc')er.t='The internet works, but the AI service could not be reached. In Firebase, make sure AI Logic is switched on and your API key is not restricted. Then try again.';
    er.d=(er.d||'')+' ['+k+']'}
  return er}
function fmt(t){const L=esc(t).split('\n');let o='',ul=false,ol=false;const close=()=>{if(ul){o+='</ul>';ul=false}if(ol){o+='</ol>';ol=false}};
  for(let l of L){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');let m;
    if(m=l.match(/^\s*#{1,4}\s+(.*)/)){close();o+='<p><b>'+m[1]+'</b></p>'}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(!ol&&!ul||ol){close();o+='<ul>';ul=true}o+='<li>'+m[1]+'</li>'}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(!ol){close();o+='<ol>';ol=true}o+='<li>'+m[1]+'</li>'}
    else{close();if(l.trim())o+=(/<b>/.test(l)&&/112/.test(l)?'<p class="w112">':'<p>')+l+'</p>'}}
  close();return o}
function localAnswer(q){const w=q.toLowerCase().split(/[^a-z]+/).filter(x=>x.length>2),sc=t=>w.reduce((n,k)=>n+(t.includes(k)?1:0),0);
  const G=GUIDES.map(g=>({g,n:sc((g.t+' '+g.s.join(' ')).toLowerCase())+3*sc(g.t.toLowerCase())})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n)[0];
  const T=TIPS.map(t=>({t,n:sc((t.c+' '+t.l.join(' ')).toLowerCase())+3*sc(t.c.toLowerCase())})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n)[0];
  if(G&&(!T||G.n>=T.n))return `**${G.g.i} ${G.g.t}**\n`+G.g.s.map((x,i)=>`${i+1}. ${x}`).join('\n')+`\n\nIf the person gets worse, call ${mainNum()} now.`;
  if(T)return `**${T.t.i} ${T.t.c}**\n`+T.t.l.map(x=>`- ${x}`).join('\n');
  return `I need the internet to answer that. In an emergency call ${mainNum()} now.`}
const scrollEnd=()=>{const a=$('#app');if(a)a.scrollTop=a.scrollHeight};
const tmf=t=>new Date(t||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function libSave(C){if(!C.length)return;if(!S.chatId)S.chatId='c'+Date.now();store.set('askChatId',S.chatId);
  const L=store.get('askLib',[]),i=L.findIndex(x=>x.id===S.chatId),e={id:S.chatId,title:String((C.find(m=>m.r==='u')||{}).t||'Chat').slice(0,48),ts:Date.now(),msgs:C};
  if(i>=0)L[i]=e;else L.unshift(e);store.set('askLib',L.slice(0,30))}
const saveChat=()=>{const C=(S.chat||[]).filter(m=>!m.pending&&!m.err).slice(-60);store.set('askChat',C);libSave(C)};
function libHTML(){const L=store.get('askLib',[]);
  if(!L.length)return '<div class="card"><p class="mut">No saved chats yet. Every conversation is saved here automatically, so you can come back to it later.</p></div>';
  return '<p class="mut" style="margin-bottom:8px">Your saved chats</p>'+L.map(x=>`<div class="libi${x.id===S.chatId?' cur':''}"><button class="libo" onclick="openChat('${x.id}')">${pic('💬',44)}<div><b>${esc(x.title)}</b><small>${new Date(x.ts).toLocaleDateString([],{day:'numeric',month:'short'})} · ${x.msgs.length} messages</small></div></button><button class="libd" onclick="delChat('${x.id}')" aria-label="Delete chat">🗑</button></div>`).join('')+'<button class="btn ghost block" style="margin-top:10px" onclick="clearLib()">Delete all chats</button>'}
function openChat(id){const x=store.get('askLib',[]).find(c=>c.id===id);if(!x||S.askBusy)return;S.chat=x.msgs.map(m=>({...m}));S.chatId=id;S.askLibOpen=false;store.set('askChat',S.chat);store.set('askChatId',id);render();scrollEnd()}
function delChat(id){store.set('askLib',store.get('askLib',[]).filter(c=>c.id!==id));if(S.chatId===id){S.chat=[];S.chatId=null;store.set('askChat',[]);store.set('askChatId',null)}render()}
function clearLib(){store.set('askLib',[]);S.chat=[];S.chatId=null;store.set('askChat',[]);store.set('askChatId',null);render()}
function toggleLib(){S.askLibOpen=!S.askLibOpen;render()}
function photoToChat(){if(!S.photoRaw)return;S.chat=[{r:'u',t:'📷 Photo check'+(S.photoNote?': '+S.photoNote:''),ts:Date.now()},{r:'a',raw:S.photoRaw,ts:Date.now()}];S.chatId=null;S.askLibOpen=false;saveChat();go('ask')}
function chatHist(){const C=S.chat||[],h=[];for(let i=0;i<C.length-1;i++){const u=C[i],a=C[i+1];if(u.r==='u'&&a.r==='a'&&!a.err&&!a.pending&&!a.off&&a.raw){h.push({role:'user',parts:[{text:u.t}]},{role:'model',parts:[{text:a.raw}]})}}return h.slice(-12)}
function chatHTML(){if(S.askLibOpen)return libHTML();const C=S.chat||[],ch=['🔥 How do I treat a burn?','🐍 What to do for a snake bite','🏫 Fire at school, what now?','🩸 How to stop a nosebleed','💧 Is this water safe to drink?'];
  let o=`<div class="m2"><div class="who">🤖</div><div class="msg a"><p>Hi, I am <b>Ask First Aid</b> 👋</p><p>Ask me anything about first aid, health or staying safe. I answer in English or Kiswahili.</p></div></div>`;
  o+=C.map(m=>m.r==='u'?`<div class="m2 u"><div class="msg u">${esc(m.t)}<span class="tm">${tmf(m.ts)}</span></div></div>`
    :`<div class="m2"><div class="who">🤖</div><div class="msg a${m.err?' err':''}">${m.pending?'<span class="dots mut">Ask First Aid is typing</span>':(m.err?`<p>${esc(m.err.t)}</p>${m.err.d?`<div class="errd">${esc(m.err.d.slice(0,200))}</div>`:''}<button class="btn ghost" style="margin-top:8px" onclick="askRetry()">↻ Try again</button>`:fmt(m.raw)+(m.off?'<p class="mut">You are offline, so this came from the app guides.</p>':'')+`<span class="tm">${tmf(m.ts)}</span>`)}</div></div>`).join('');
  if(!C.length)o+=`<div class="chips">${ch.map(c=>`<button onclick="askSend('${c}')">${c}</button>`).join('')}</div>`;
  return o}
function paintChat(){const l=$('#chatlog');if(l){l.innerHTML=chatHTML();scrollEnd()}}
async function askSend(q){const inp=$('#aq');q=(q||(inp&&inp.value)||'').trim();if(!q||S.askBusy)return;if(inp)inp.value='';
  if(!S.chat)S.chat=store.get('askChat',[]);if(S.askLibOpen){S.askLibOpen=false;render()}const hist=chatHist();
  const a={r:'a',pending:true,ts:Date.now()};S.chat.push({r:'u',t:q,ts:Date.now()},a);S.askBusy=true;paintChat();
  try{if(!navigator.onLine){a.raw=localAnswer(q);a.off=true}else a.raw=await chatAI(hist,q)}
  catch(e){a.err=await aiFail(e)}
  a.pending=false;a.ts=Date.now();S.askBusy=false;if(!a.err)saveChat();if(S.route==='ask')paintChat()}
function askRetry(){const C=S.chat||[],a=C[C.length-1],u=C[C.length-2];if(S.askBusy||!a||!a.err||!u)return;C.splice(-2);askSend(u.t)}
function newChat(){if(S.askBusy)return;S.chat=[];S.chatId=null;S.askLibOpen=false;store.set('askChat',[]);store.set('askChatId',null);render()}
function ask(){if(!S.chat)S.chat=store.get('askChat',[]);if(S.chatId===undefined)S.chatId=store.get('askChatId',null);if(S.chat.length)setTimeout(scrollEnd,30);
  return ['Ask First Aid',`<div class="dang" style="position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;justify-content:space-between"><b>🚨 Emergency? Call now, do not type.</b><button class="btn red" onclick="location.href='tel:'+mainNum()">Call ${mainNum()}</button></div>
  <div class="chathead"><button onclick="toggleLib()">${S.askLibOpen?'← Back to chat':'📚 Library'}</button><button onclick="newChat()">＋ New chat</button></div>
  <div id="chatlog">${chatHTML()}</div>
  <div class="sticky"><div class="askbar"><input id="aq" placeholder="Type your question…" autocomplete="off" enterkeyhint="send" onkeydown="if(event.key==='Enter')askSend()"><button class="btn red" onclick="askSend()">Send</button></div>
  <p class="mut" style="font-size:12px;margin-top:6px">Free AI help. Needs internet. Guidance only, not a doctor.</p></div>`]}
async function askPhoto(){const m=S.media;if(!m||m.video||S.photoBusy)return;S.photoBusy=true;S.photoAI='';S.photoRaw='';render();let h;
  try{if(!navigator.onLine)throw new Error('offline');const data=await shrinkImage(m.file);
    const txt=await askAI([`The user took this photo of an injury or emergency.${S.photoNote?' Their note: '+S.photoNote:''} Say briefly what you can see (do not diagnose), then give clear first-aid steps. If it looks serious start with **Call ${mainNum()} now**. If the photo is unclear, say so and ask what happened.`,{inlineData:{data:data.split(',')[1],mimeType:'image/jpeg'}}]);S.photoRaw=txt;h=fmt(txt)}
  catch(e){const er=navigator.onLine?await aiFail(e):{t:'You are offline. Connect to the internet so Ask First Aid can look at the photo. Meanwhile pick what it looks like below and follow the steps.'};h=`<p>${esc(er.t)}</p>${er.d?`<div class="errd">${esc(er.d.slice(0,200))}</div>`:''}`}
  S.photoAI=h+'<p class="mut">Guidance only, not a diagnosis.</p>';S.photoBusy=false;if(S.route==='scan')render()}

async function loadDaily(){const k=dayKey();if((store.get('dailyTopic',{})||{}).k===k)return;
  try{const used=store.get('usedTopics',[]);
    const txt=await askAI(`Give ONE new safety topic for school children and teachers in Kenya for today (${new Date().toDateString()}). Do not use these topics: ${[...TIPS.map(t=>t.c),...used].join(', ')}. Reply ONLY with JSON: {"topic":"short title","icon":"one emoji","tips":["tip 1","tip 2","tip 3","tip 4","tip 5"]}. Keep tips short, simple and safe.`);
    const j=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(j.topic&&Array.isArray(j.tips)&&j.tips.length){store.set('dailyTopic',{k,c:String(j.topic),i:String(j.icon||'💡'),l:j.tips.slice(0,6).map(String)});store.set('usedTopics',[...used,String(j.topic)].slice(-60))}}catch(e){}
  if(S.route==='tips')render()}

/* ---- SOS ---- */
let sosTimer=null,sosCancel=false;
function userContacts(){return store.get('contacts',[])}
function sos(){
  const c=userContacts();
  return ['Emergency alert (SOS)',`<p class="mut" style="text-align:center">Tap to send your GPS location and see your contacts and the nearest hospitals.</p>
  <button class="sosbtn" onclick="startSOS()">SOS</button>
  <p class="mut" style="text-align:center">${c.length?`${c.length} contact${c.length>1?'s':''} will be alerted.`:'No contacts saved yet. Add contacts first so the alert reaches someone.'}</p>
  <button class="btn ghost block" style="margin-top:14px" onclick="go('contacts')">Manage contacts</button>`];
}
function startSOS(){
  sosCancel=false;let n=3;const ov=$('#ov');ov.className='show';
  const draw=()=>ov.innerHTML=`<div class="big">${n}</div><h2 style="margin:10px 0">Sending alert…</h2><p>Getting your location</p><button class="btn" onclick="cancelSOS()">Cancel</button>`;
  draw();
  const loc=getLoc();
  const hp=loc.then(findHospitals);
  sosTimer=setInterval(async()=>{n--;if(n>0){draw();return}clearInterval(sosTimer);if(sosCancel)return;finishSOS(await loc,hp)},1000);
}
function cancelSOS(){sosCancel=true;clearInterval(sosTimer);$('#ov').className=''}
let locErr='';
function getLoc(){
  return new Promise(res=>{
    if(!navigator.geolocation){locErr='unsupported';return res(null)}
    const ok=p=>{locErr='';const l={lat:p.coords.latitude,lng:p.coords.longitude};store.set('lastloc',l);res(l)};
    const fail=e=>{locErr=e&&e.code===1?'denied':'unavailable';const last=store.get('lastloc',null);res(e&&e.code!==1&&last?last:null)};
    navigator.geolocation.getCurrentPosition(ok,e=>{
      if(e&&e.code===1)return fail(e);
      navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:false,timeout:20000,maximumAge:600000});

/* Nearby hospitals from OpenStreetMap (free, no key). Tries 3 servers at once, widens the search, then a second service. */
const OVP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
function ovQuery(R,loc){
  const a=`(around:${R},${loc.lat},${loc.lng})`;
  const q=`[out:json][timeout:25];(nwr["amenity"~"^(hospital|clinic|doctors|health_post)$"]${a};nwr["healthcare"~"^(hospital|clinic|centre|doctor)$"]${a};);out center tags 100;`;
  const one=async u=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
    try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});
      if(!r.ok)throw new Error('http '+r.status);const j=await r.json();
      if(!j.elements||(!j.elements.length&&j.remark))throw new Error('overloaded');return j.elements}
    finally{clearTimeout(tm)}};
  return Promise.any(OVP.map(one));
}
function toFac(e,loc){const t=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);if(la==null||lo==null)return null;
  const ph=String(t.phone||t['contact:phone']||t['contact:mobile']||'').split(';')[0].replace(/[^\d+]/g,'');
  const rawImg=t.image||t.photo||'';
  const commons=t.wikimedia_commons||'';
  const specs=String(t['healthcare:speciality']||t['healthcare:specialty']||t['medical:specialty']||t.speciality||'').split(/[;,|]/).map(v=>v.trim()).filter(Boolean);
  const services=String(t.healthcare||t['healthcare:facility']||'').split(/[;,|]/).map(v=>v.trim()).filter(Boolean);
  const isH=t.amenity==='hospital'||t.healthcare==='hospital';return{name:t.name||(isH?'Hospital':'Clinic'),la,lo,ph,km:kmBetween(loc.lat,loc.lng,la,lo),h:isH,image:rawImg,commons,website:t.website||t['contact:website']||'',operator:t.operator||'',services:[...new Set([...specs,...services])],emergency:t.emergency||''}}
let hospErr='';
async function nominatim(loc){
  const d=0.5,vb=`${loc.lng-d},${loc.lat+d},${loc.lng+d},${loc.lat-d}`;
  let out=[],fails=0,terms=['hospital','clinic','health centre'];
  for(const q of terms){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&bounded=1&viewbox=${vb}&q=${encodeURIComponent(q)}`);
      if(!r.ok)throw new Error('http '+r.status);out=out.concat(await r.json());if(out.length>=3)break}
    catch(e){fails++}
  }
  if(!out.length&&fails===terms.length)throw new Error('net');
  return out.map(x=>({name:x.name||String(x.display_name||'Hospital').split(',')[0],la:+x.lat,lo:+x.lon,ph:'',km:kmBetween(loc.lat,loc.lng,+x.lat,+x.lon),h:x.type==='hospital',image:'',commons:'',services:[]}));
}
async function findHospitals(loc){
  if(!loc)return null;hospErr='';
  const key='hosp:'+loc.lat.toFixed(1)+','+loc.lng.toFixed(1);
  const fin=l=>{l=l.filter((x,i,a)=>a.findIndex(y=>y.name===x.name&&Math.abs(y.la-x.la)<0.0005&&Math.abs(y.lo-x.lo)<0.0005)===i).sort((a,b)=>a.km-b.km).slice(0,6);if(l.length)store.set(key,l);return l};
  try{let els=await ovQuery(20000,loc);if(!els.length)els=await ovQuery(60000,loc);
    const l=fin(els.map(e=>toFac(e,loc)).filter(Boolean));if(l.length)return l;hospErr='none'}catch(e){hospErr='net'}
  try{const l=fin(await nominatim(loc));if(l.length){hospErr='';return l}}catch(e){}
  const old=store.get(key,null);return old&&old.length?old:null;
}

function login(){
  const reg=S.reg||!useFB;
  return ['Welcome',`<div class="card"><h3>${S.reg?'Create account':(useFB?'Sign in':'Get started')}</h3>
  ${reg?'<input id="ln" placeholder="Your name">':''}
  ${useFB?'<input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password (6+ characters)">':''}
  ${reg?`<select id="lr" onchange="$('#apw').style.display=this.value==='Admin'?'block':'none'" style="width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px;font-size:16px;background:var(--card);color:var(--ink)"><option>Student</option><option>Teacher</option>${!useFB?'<option>Admin</option>':''}</select>${!useFB?'<input id="apw" type="password" placeholder="Admin password" style="display:none">':''}`:''}
  <button class="btn block" onclick="doLogin()">${S.reg?'Create account':(useFB?'Sign in':'Continue')}</button>
  ${useFB?`<button class="btn ghost block" style="margin-top:8px" onclick="S.reg=!S.reg;render()">${S.reg?'I already have an account':'Create a new account'}</button>`:'<p class="mut" style="margin-top:10px">Demo mode: nothing is stored online. Paste your Firebase keys into the file to turn on real accounts and a live admin screen.</p>'}
  <p id="lerr" style="color:#c81428;margin-top:8px"></p></div>`];
}
function setProfile(p){store.set('profile',p);store.set('me',p.name);go('home')}
function logout(){if(useFB&&fbAuth)fbAuth.signOut();store.set('profile',null);S.reg=false;go('login')}
async function doLogin(){
  const g=id=>(($('#'+id)||{}).value||''),err=m=>{$('#lerr').textContent=m};
  try{
    if(!useFB){const n=g('ln').trim();if(!n)return err('Enter your name.');const role=g('lr')||'Student';if(role==='Admin'&&hashPw(g('apw'))!==ADMIN_HASH)return err('Wrong admin password.');return setProfile({name:n,role})}
    const e=g('le').trim(),pw=g('lp');if(!e||pw.length<6)return err('Enter your email and a password of 6+ characters.');
    if(S.reg){const n=g('ln').trim();if(!n)return err('Enter your name.');const role=g('lr')||'Student';
      const r=await fbAuth.createUserWithEmailAndPassword(e,pw);
      await fbDb.collection('Users').doc(r.user.uid).set({name:n,email:e,role,emergencyContacts:[]});return setProfile({name:n,role,email:e})}
    const r=await fbAuth.signInWithEmailAndPassword(e,pw),d=await fbDb.collection('Users').doc(r.user.uid).get(),u=d.data()||{};
    setProfile({name:u.name||e,role:u.role||'Student',email:e});
  }catch(x){err(x.message)}
}
function admin(){
  const p=store.get('profile',{});
  if(p.role!=='Admin')return ['Admin dashboard','<div class="card"><p>Only admin accounts can open this screen.</p></div>'];
  if(S.err)return ['Admin dashboard',`<div class="card"><p>Could not load alerts: ${esc(S.err)}</p></div>`];
  const A=S.alerts;if(!A)return ['Admin dashboard','<p class="mut">Loading alerts…</p>'];
  const c=s=>A.filter(a=>a.status===s).length;
  const stat=(n,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div style="font-size:26px;font-weight:800;color:var(--head)">${n}</div><div class="mut">${l}</div></div>`;
  return ['Admin dashboard',`<p class="mut" style="margin-bottom:8px">${useFB?'Live from Firebase.':'Demo mode: showing alerts from this device only.'}</p>
  <div class="row" style="margin-bottom:12px">${stat(c('New'),'New')}${stat(c('Responding'),'Responding')}${stat(c('Resolved'),'Resolved')}</div>`+
  (A.length?A.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.name||'Unknown')}</b><div class="mut">${new Date(a.time).toLocaleString()}</div></div><span class="pill ${a.status}">${a.status}</span></div>
  ${a.photo?`<img src="${a.photo}" alt="Injury photo" onclick="window.open(this.src)" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#111;margin-top:8px">`:''}${a.note?`<p style="margin:6px 0">${esc(a.note)}</p>`:''}
  <div style="margin:8px 0">${a.lat!=null?`<a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noopener" style="color:var(--head);font-weight:600">View location on map</a>`:'<span class="mut">No GPS location</span>'}</div>
  <div class="row">${['Responding','Resolved'].map(s=>`<button class="btn ${a.status===s?'':'ghost'}" onclick="setSt('${a.id}','${s}')">${s}</button>`).join('')}</div></div>`).join(''):'<div class="card"><p class="mut">No alerts yet.</p></div>')];
}
function setSt(id,s){DB.setStatus(id,s).then(()=>{if(!useFB){S.alerts=store.get('allAlerts',[]);S.lastJ='';render()}}).catch(e=>alert(e.message))}

/* live mode: re-check who is signed in and their real role from the server on every start */
if(useFB)fbAuth.onAuthStateChanged(async u=>{
  if(!u){if(store.get('profile',null)){store.set('profile',null)}render();return}
  try{const x=(await fbDb.collection('Users').doc(u.uid).get()).data();
    const sn=(await fbDb.collection('Settings').doc('numbers').get()).data();if(sn&&sn.list){store.set('numbers',sn.list.map(o=>[o.name,o.phone]));render()}
    if(x){const pr=store.get('profile',null),np={name:x.name||u.email,role:x.role||'Student',email:u.email};
      if(!pr||pr.role!==np.role||pr.name!==np.name){store.set('profile',np);store.set('me',np.name);render()}}}catch(e){}
});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
